services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: yuktiprep-nginx
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - client
      - web
      - admin
      - backend
      - ocr-api
    networks:
      - yukti-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yuktiprep-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      FRONTEND_URL: https://client.yuktiprep.com
      APP_FRONTEND_URL: https://ap.yuktiprep.com
      ADMIN_FRONTEND_URL: https://ad.yuktiprep.com
      REDIS_URL: redis://redis:6379
    expose:
      - "4000"
    depends_on:
      - db
      - redis
    networks:
      - yukti-network


  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://ba.yuktiprep.com
    container_name: yuktiprep-client
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://ba.yuktiprep.com
    expose:
      - "3000"
    networks:
      - yukti-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://ba.yuktiprep.com
    container_name: yuktiprep-web
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://ba.yuktiprep.com
    expose:
      - "5001"
    networks:
      - yukti-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://ba.yuktiprep.com
        NEXT_PUBLIC_OCR_API_URL: https://ba.yuktiprep.com/ocr
    container_name: yuktiprep-admin
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://ba.yuktiprep.com
      NEXT_PUBLIC_OCR_API_URL: https://ba.yuktiprep.com/ocr
    expose:
      - "5000"
    networks:
      - yukti-network

  ocr-api:
    build:
      context: ./ocr-api
      dockerfile: Dockerfile
    container_name: yuktiprep-ocr-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      - OCR_DEFAULT_LANGUAGES=eng+hin
      - OCR_DEFAULT_DPI=300
      - OCR_MAX_FILE_SIZE_MB=100
      - OCR_TIMEOUT_SECONDS=300
    networks:
      - yukti-network

  redis:
    image: redis:7-alpine
    container_name: yuktiprep-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - yukti-network

  db:
    image: postgres:16
    container_name: yuktiprep-db-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: yuktiprep-db
    volumes:
      - a5dbdb2eda2654b6144cbc1e2205a0db17a50a60a215f8241f75a3c3ed768384:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - yukti-network

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: yuktiprep-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: yuktiprep-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_SUFFIX: ".sql.gz"
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      - db
    networks:
      - yukti-network

volumes:
  redis_data:
  a5dbdb2eda2654b6144cbc1e2205a0db17a50a60a215f8241f75a3c3ed768384:
    external: true

networks:
  yukti-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
