# STAGE 1 - Development, CI and staging validation
# (change request -> feature branch -> PR -> CI -> security -> build/sign -> staging -> acceptance -> review -> merge)
name: 01 CI and staging validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Start CI with isolated runners and least privilege -> locked deps -> lint/type -> tests
  quality:
    name: Lint, type checks, unit/API/integration/contract tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}     
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make install-locked
      - run: make lint
      - run: make typecheck
      - run: make test-unit
      - run: make test-api
      - run: make test-integration
      - run: make test-contract

  # ---- Security and configuration checks (three parallel branches)
  sast-secrets:
    name: CodeQL SAST and secret scanning
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ vars.CODEQL_LANGUAGES || 'javascript-typescript,python' }}

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:codeql"
          output: codeql-results        
          upload: always                

      - name: Upload CodeQL SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-report
          path: codeql-results/*.sarif

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    supply-chain:
    name: Dependency, license and container checks
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write      
      security-events: write    
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, AGPL-3.0-only
          comment-summary-in-pr: always

      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-report.json
          exit-code: "0"         

      - name: Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-report.json
            trivy-results.sarif

      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"

  config-validation:
    name: Docker, Kubernetes and IaC validation
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"
      - name: Render and schema-validate Kubernetes manifests
        run: |
          for env in staging production; do
            echo "== $env"; kustomize build k8s/overlays/$env \
              | docker run -i --rm ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -
          done
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s
          framework: kubernetes,dockerfile
          soft_fail: ${{ vars.CHECKOV_SOFT_FAIL == 'true' }}

  ci-gate:
    name: All required CI checks pass?
    if: always()
    needs: [quality, sast-secrets, supply-chain, config-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::Required CI checks failed - report failure and fix the feature branch"; exit 1
          fi

  # ---- Yes -> Build images (buildx) -> SBOM/provenance -> scan -> sign -> policy -> immutable push -> record SHA + digests
  build-publish:
    name: Build, sign and publish immutable images
    needs: ci-gate
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_build-image.yml
    with:
      git_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # ---- Prepare isolated staging -> ... -> acceptance
  staging:
    name: Staging acceptance criteria pass?
    needs: build-publish
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: staging-environment            
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      IMAGE: ${{ needs.build-publish.outputs.image }}@${{ needs.build-publish.outputs.digest }}
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      REGISTRY: ${{ vars.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      STAGING_NAMESPACE: ${{ vars.STAGING_NAMESPACE || 'app-staging' }}
      MIGRATE_EXPAND_CMD: ${{ vars.MIGRATE_EXPAND_CMD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cluster
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Prepare isolated staging environment
        run: kubectl apply -f k8s/overlays/staging/namespace.yaml

      - name: Validate secrets, configuration and resource quotas
        run: |
          bash scripts/sync-registry-secret.sh staging
          bash scripts/preflight.sh staging
      - name: Verify image signature and provenance
        run: bash scripts/verify-image.sh "$IMAGE"

      - name: Provision Utho CSI volumes where required
        run: |
          ( cd k8s/overlays/staging && kustomize edit set image "app=$IMAGE" )
          kubectl kustomize k8s/overlays/staging | kubectl apply -f - -l app.kubernetes.io/component=storage || echo "no storage resources"

      - name: Apply compatible staging database migrations
        run: bash scripts/migrate.sh staging expand "$IMAGE"

      - name: Deploy exact image digests (Kustomize)
        run: bash scripts/deploy.sh staging rolling "$IMAGE"

      - name: Validate deployment, probes, Utho LB, nginx ingress, DNS and cert-manager TLS
        run: |
          kubectl -n "$STAGING_NAMESPACE" rollout status deploy/app --timeout=300s     # startup/readiness/liveness gate
          bash scripts/verify-routing.sh staging

      - name: Run staging smoke and end-to-end journeys
        run: |
          bash scripts/smoke.sh "$STAGING_URL"
          make test-e2e BASE_URL="$STAGING_URL"

      - name: Run k6 load tests
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/smoke-load.js
          flags: -e BASE_URL=${{ vars.STAGING_URL }}

      - name: Run OWASP ZAP DAST
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
          allow_issue_writing: false
          fail_action: true
          cmd_options: "-a"

      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-html-report
          path: report_html.html

      # ---- Yes branch
      - name: Collect validation evidence
        if: success()
        run: |
          bash scripts/collect-evidence.sh staging evidence
          echo "Staging acceptance PASSED for $IMAGE" > evidence/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-validation-evidence
          path: evidence/
          if-no-files-found: ignore
      - name: Attach validation evidence to pull request
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: [
                '### Staging validation passed',
                'Image: `' + process.env.IMAGE + '`',
                'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                'Evidence artifact: `staging-validation-evidence`',
                '',
                'Next: code owner / security review, then merge through the protected `main` branch.'
              ].join('\n')
            });

      # ---- No branch: collect logs and test evidence -> revert failed staging deployment -> report
      - name: Collect logs and test evidence (failure)
        if: failure()
        run: bash scripts/collect-evidence.sh staging evidence || true
      - name: Revert staging deployment (failure)
        if: failure()
        run: bash scripts/rollback.sh staging || true

  report-failure:
    name: Report failure and fix feature branch
    if: always() && github.event_name == 'pull_request' && contains(needs.*.result, 'failure')
    needs: [ci-gate, build-publish, staging]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: 'CI / staging validation **failed**. Fix on the feature branch and push again.\n' +
                    context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
