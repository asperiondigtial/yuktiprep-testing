# STAGE 3 - Continuous improvement
name: 06 Delivery metrics

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  metrics:
    name: Review delivery metrics and improve pipeline
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/delivery-metrics.sh 30 | tee -a "$GITHUB_STEP_SUMMARY"
