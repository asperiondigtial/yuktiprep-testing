services:
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-api-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OCR_DEFAULT_LANGUAGES=eng+hin
      - OCR_DEFAULT_DPI=300
      - OCR_MAX_FILE_SIZE_MB=100
      - OCR_TIMEOUT_SECONDS=300

