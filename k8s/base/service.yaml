apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  type: ClusterIP
  # NOTE: scripts/deploy.sh adds `slot: <base|green>` to this selector with `kubectl patch`.
  # It is intentionally NOT in the manifest so re-applying never flips blue/green traffic.
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 80
      targetPort: http
