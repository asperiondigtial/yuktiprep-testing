#   -n ingress-nginx --create-namespace -f k8s/cluster-addons/ingress-nginx-values.yaml
# The controller Service of type LoadBalancer is what provisions the Utho Load Balancer.
controller:
  replicaCount: 2
  service:
    type: LoadBalancer
    annotations: {}     
  metrics:
    enabled: true
