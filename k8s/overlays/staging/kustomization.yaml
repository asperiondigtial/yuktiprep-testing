apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-staging
resources:
  - ../../base
  - namespace.yaml
  - quota.yaml
# Enable when the service needs a Utho CSI volume ("Provision Utho CSI volumes where required"):
# components:
#   - ../../components/persistent-storage
images:
  - name: app
    newName: registry.example.com/your-org/app   # overwritten by `kustomize edit set image` in CI
labels:
  - pairs:
      environment: staging
    includeSelectors: false
patches:
  - target: {kind: Deployment, name: app}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: HorizontalPodAutoscaler, name: app}
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target: {kind: Ingress, name: app}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.example.com
